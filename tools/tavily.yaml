tool: tavily
setups:
  tavily_advanced:
    class: main
    pricing:
      list_usd: 0.016
      basis: list
      bills_empty: true
      # Advanced Extract, 2 credits per 5 successful URLs, at the pay-as-you-go $0.008 per credit
